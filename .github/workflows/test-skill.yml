# Paris Review Analyst (巴黎评论员) — CI 测试 (v2.1.3)
#
# 作用：
#   - 每次 push / PR 自动跑 CLI 烟雾测试 + 字段完整性回归
#   - 拦截"改坏字段完整性 / 改坏 CLI 识别"的 PR
#   - **不**自动 publish 到 skillhub（发版仍走 skillhub-upload CLI 手动触发）
#
# 触发：
#   - push 到 main 分支
#   - 任何 PR
#
# 失败标准：
#   - CLI 烟雾测试：任何一条 case 失败 → ❌
#   - 字段完整性：API 不可达时跳过（用 offline fixtures 也可跑）

name: test-skill

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'references/**'
      - 'tests/**'
      - 'SKILL.md'
      - 'skill.yaml'
      - 'VERSIONS.md'
      - '.github/workflows/test-skill.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'references/**'
      - 'tests/**'
      - 'SKILL.md'
      - 'skill.yaml'
      - 'VERSIONS.md'
      - '.github/workflows/test-skill.yml'

# 取消正在跑的同分支旧 run，避免冗余
concurrency:
  group: test-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-smoke:
    name: CLI 命令识别烟雾测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 跑 CLI 烟雾测试（无需 API）
        run: |
          cd tests
          python3 test_cli_smoke.py

  field-completeness:
    name: 字段完整性回归（需 API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 跑字段完整性测试
        env:
          # Worker API 地址，老巴需在 GitHub Secrets 配置
          PARIS_API_BASE: ${{ secrets.WORKER_API_URL }}
        run: |
          cd tests
          if [ -z "$PARIS_API_BASE" ]; then
            echo "::warning::PARIS_API_BASE 未配置，用 offline fixtures 跑测（仅覆盖海明威 1 条）"
            python3 test_field_completeness.py --offline
          else
            python3 test_field_completeness.py
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-completeness-report
          path: tests/report.txt
          retention-days: 7